<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - JR Serviços / TrampoJá</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-9">
        
        <h2 class="text-center text-danger mb-4">Plataforma JR Serviços - Criar Conta</h2>

        <!-- NAVEGAÇÃO ENTRE OS DOIS FORMULÁRIOS -->
        <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active btn-danger" id="tab-trabalhador" data-bs-toggle="pill" data-bs-target="#form-trabalhador" type="button" role="tab">
              👤 Sou Profissional (PF)
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link btn-outline-danger" id="tab-empresa" data-bs-toggle="pill" data-bs-target="#form-empresa" type="button" role="tab">
              🏢 Sou Empresa / Contratante (PJ)
            </button>
          </li>
        </ul>

        <div class="tab-content card bg-secondary text-white p-4 shadow" id="pills-tabContent">
          
          <!-- FORMULÁRIO 1: PROFISSIONAL / TRABALHADOR (PF) -->
          <div class="tab-pane fade show active" id="form-trabalhador" role="tabpanel">
            <h4 class="text-warning mb-3">Cadastro de Profissional (Pessoa Física)</h4>
            <form id="formCadastroPF" action="javascript:void(0);">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Nome Completo</label>
                  <input type="text" class="form-control" name="nome" required placeholder="Ex: João da Silva">
                </div>
                <div class="col-md-6">
                  <label class="form-label">CPF</label>
                  <input type="text" class="form-control" name="cpf" required placeholder="000.000.000-00">
                </div>
                <div class="col-md-6">
                  <label class="form-label">E-mail</label>
                  <input type="email" class="form-control" name="email" required placeholder="joao@email.com">
                </div>
                <div class="col-md-6">
                  <label class="form-label">WhatsApp / Telefone</label>
                  <input type="tel" class="form-control" name="telefone" required placeholder="(81) 99999-9999">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Profissão / Especialidade</label>
                  <input type="text" class="form-control" name="especialidade" required placeholder="Ex: Eletricista, Encanador">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Valor Médio por Hora (R$)</label>
                  <input type="number" step="0.01" class="form-control" name="valorHora" placeholder="50.00">
                </div>
                <div class="col-12">
                  <label class="form-label">Cidade / Bairro de Atendimento</label>
                  <input type="text" class="form-control" name="localizacao" required placeholder="Ex: Recife - PE">
                </div>
                <div class="col-12">
                  <label class="form-label">Descrição dos Serviços Prestados</label>
                  <textarea class="form-control" name="descricao" rows="3" placeholder="Descreva sua experiência..."></textarea>
                </div>
              </div>

              <button type="submit" class="btn btn-danger w-100 mt-4">Cadastrar Profissional</button>
            </form>
          </div>

          <!-- FORMULÁRIO 2: EMPRESA / CONTRATANTE (PJ) -->
          <div class="tab-pane fade" id="form-empresa" role="tabpanel">
            <h4 class="text-warning mb-3">Cadastro de Empresa / Contratante (Pessoa Jurídica)</h4>
            <form id="formCadastroPJ" action="javascript:void(0);">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Razão Social / Nome Fantasia</label>
                  <input type="text" class="form-control" name="nomeEmpresa" required placeholder="Ex: Tech Serviços LTDA">
                </div>
                <div class="col-md-6">
                  <label class="form-label">CNPJ</label>
                  <input type="text" class="form-control" name="cnpj" required placeholder="00.000.000/0001-00">
                </div>
                <div class="col-md-6">
                  <label class="form-label">E-mail Corporativo</label>
                  <input type="email" class="form-control" name="email" required placeholder="contato@empresa.com">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Telefone / WhatsApp Comercial</label>
                  <input type="tel" class="form-control" name="telefone" required placeholder="(81) 3333-4444">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Nome do Responsável / Contato</label>
                  <input type="text" class="form-control" name="responsavel" required placeholder="Ex: Maria Ramos">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Ramo de Atuação</label>
                  <input type="text" class="form-control" name="ramo" required placeholder="Ex: Construção, Tecnologia">
                </div>
                <div class="col-12">
                  <label class="form-label">Endereço Completo da Sede</label>
                  <input type="text" class="form-control" name="endereco" required placeholder="Rua, Número, Bairro, Cidade - Estado">
                </div>
              </div>

              <button type="submit" class="btn btn-danger w-100 mt-4">Cadastrar Empresa</button>
            </form>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

  <script>
    // Envio do Profissional (PF)
    document.getElementById('formCadastroPF').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const dados = Object.fromEntries(formData.entries());

      try {
        const resposta = await fetch('/api/cadastrar-trabalhador', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          alert('✅ ' + resultado.mensagem);
          this.reset();
        } else {
          alert('⚠️ Erro: ' + resultado.erro);
        }
      } catch (err) {
        alert('❌ Erro de conexão com o servidor.');
      }
    });

    // Envio da Empresa (PJ)
    document.getElementById('formCadastroPJ').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const dados = Object.fromEntries(formData.entries());

      try {
        const resposta = await fetch('/api/cadastrar-empresa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          alert('✅ ' + resultado.mensagem);
          this.reset();
        } else {
          alert('⚠️ Erro: ' + resultado.erro);
        }
      } catch (err) {
        alert('❌ Erro de conexão com o servidor.');
      }
    });
  </script>
</body>
</html>
