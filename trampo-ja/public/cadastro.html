<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro em Etapas - TrampoJá</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="/" class="brand">TrampoJá</a>
    <nav class="nav-links">
      <a href="/">Início</a>
      <a href="/cadastro" class="active">Cadastrar-se</a>
      <a href="/contratante">Painel Contratante</a>
      <a href="/trabalhador">Painel Trabalhador</a>
    </nav>
  </header>

  <main class="main-container">
    <div class="step-box">
      <h1 class="page-title">Cadastro de Profissional</h1>
      <p class="page-subtitle" id="stepIndicator">Etapa 1 de 2: Dados Pessoais</p>

      <form id="multiStepForm">
        <div class="form-step active" id="step1">
          <div class="form-group">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
          </div>
          <div class="form-group">
            <label>Cidade / Estado</label>
            <input type="text" id="cidade" value="Recife - PE" required>
          </div>
          <button type="button" class="btn-primary" onclick="nextStep(2)">Próxima Etapa →</button>
        </div>

        <div class="form-step" id="step2">
          <div class="form-group">
            <label>Qual a sua Função Principal?</label>
            <select id="funcao" required>
              <option value="Auxiliar de Logistica">Auxiliar de Logistica</option>
              <option value="Suporte Tecnico">Suporte Tecnico</option>
              <option value="Atendimento ao Cliente">Atendimento ao Cliente</option>
            </select>
          </div>
          <div style="margin-top: 20px;">
            <button type="button" class="btn-secondary" onclick="nextStep(1)">← Voltar</button>
            <button type="submit" class="btn-primary">Finalizar Cadastro</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    function nextStep(step) {
      document.querySelectorAll('.form-step').forEach(el => el.classList.remove('active'));
      document.getElementById(`step${step}`).classList.add('active');
      document.getElementById('stepIndicator').textContent = `Etapa ${step} de 2: ${step === 1 ? 'Dados Pessoais' : 'Perfil Profissional'}`;
    }

    document.getElementById('multiStepForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nome: document.getElementById('nome').value,
        cidade: document.getElementById('cidade').value,
        funcao: document.getElementById('funcao').value
      };

      const res = await fetch('/api/cadastrar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      alert(data.mensagem);
      window.location.href = '/contratante';
    });
  </script>

</body>
</html>
