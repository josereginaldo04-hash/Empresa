<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Contratante - TrampoJá</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <header class="navbar">
    <a href="/" class="brand">TrampoJá</a>
    <nav class="nav-links">
      <a href="/">Início</a>
      <a href="/cadastro">Cadastrar-se</a>
      <a href="/contratante" class="active">Painel Contratante</a>
      <a href="/trabalhador">Painel Trabalhador</a>
    </nav>
  </header>

  <main class="main-container">
    <h1 class="page-title">Buscar Profissionais Disponíveis</h1>
    <p class="page-subtitle">Consulte em tempo real os trabalhadores cadastrados no Back-end:</p>

    <div class="form-group" style="max-width: 400px; margin-bottom: 30px;">
      <label>Filtrar Categoria:</label>
      <select id="filtroFuncao" onchange="carregarProfissionais()">
        <option value="todas">Todas as Funções</option>
        <option value="Auxiliar de Logistica">Auxiliar de Logistica</option>
        <option value="Suporte Tecnico">Suporte Tecnico</option>
        <option value="Atendimento ao Cliente">Atendimento ao Cliente</option>
      </select>
    </div>

    <div class="grid-cards" id="containerTrabalhadores">
    </div>
  </main>

  <script>
    async function carregarProfissionais() {
      const filtro = document.getElementById('filtroFuncao').value;
      const res = await fetch(`/api/trabalhadores?funcao=${filtro}`);
      const dados = await res.json();

      const container = document.getElementById('containerTrabalhadores');
      container.innerHTML = '';

      if (dados.length === 0) {
        container.innerHTML = '<p style="color:#aaa;">Nenhum profissional online nesta categoria.</p>';
        return;
      }

      dados.forEach(p => {
        container.innerHTML += `
          <div class="card">
            <span class="badge">ONLINE</span>
            <h3 style="margin-top:10px;">${p.nome}</h3>
            <p style="color:#aaa; font-size:0.9rem; margin-top:4px;">${p.funcao}</p>
            <p style="color:#aaa; font-size:0.85rem;">${p.cidade} • Avaliação: ${p.avaliacao}</p>
            <button class="btn-primary" style="width:100%; margin-top:16px;" onclick="alert('Solicitação disparada para ${p.nome}!')">Solicitar Agora</button>
          </div>
        `;
      });
    }

    carregarProfissionais();
  </script>

</body>
</html>
