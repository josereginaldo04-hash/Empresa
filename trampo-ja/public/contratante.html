<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Empresa - JR Serviços</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        
        <h2 class="text-center text-danger mb-4">Plataforma JR Serviços - Cadastro Geral</h2>

        <div class="card bg-secondary text-white p-4 shadow border-warning">
          <h3 class="text-warning mb-2">🏢 2. Empresa / Contratante (PJ)</h3>
          <p class="text-light small mb-3">Cadastre sua empresa para contratar profissionais ou divulgar vagas.</p>
          <hr class="border-light mt-0 mb-4">

          <form id="formCadastroPJ" action="javascript:void(0);">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Razão Social / Nome Fantasia</label>
                <input type="text" class="form-control" name="nomeEmpresa" required placeholder="Ex: Tech Serviços LTDA">
              </div>
              <div class="col-md-6">
                <label class="form-label">CNPJ</label>
                <input type="text" class="form-control" name="cnpj" required placeholder="00.000.000/0001-00">
              </div>
              <div class="col-md-6">
                <label class="form-label">Telefone Comercial</label>
                <input type="tel" class="form-control" name="telefone" required placeholder="(81) 3333-4444">
              </div>
              <div class="col-12">
                <label class="form-label">E-mail Corporativo</label>
                <input type="email" class="form-control" name="email" required placeholder="contato@empresa.com">
              </div>
              <div class="col-md-6">
                <label class="form-label">Responsável / Contato</label>
                <input type="text" class="form-control" name="responsavel" required placeholder="Ex: Maria Ramos">
              </div>
              <div class="col-md-6">
                <label class="form-label">Ramo de Atuação</label>
                <input type="text" class="form-control" name="ramo" required placeholder="Ex: Construção Civil">
              </div>
              <div class="col-12">
                <label class="form-label">Endereço da Sede</label>
                <input type="text" class="form-control" name="endereco" required placeholder="Rua, Bairro, Cidade - Estado">
              </div>
            </div>

            <button type="submit" class="btn btn-warning text-dark font-weight-bold w-100 mt-4">Cadastrar Empresa</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.getElementById('formCadastroPJ').addEventListener('submit', async function(e) {
      e.preventDefault();
      const formData = new FormData(this);
      const dados = Object.fromEntries(formData.entries());

      try {
        const resposta = await fetch('/api/cadastrar-empresa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
          alert('✅ ' + resultado.mensagem);
          this.reset();
        } else {
          alert('⚠️ Erro: ' + resultado.erro);
        }
      } catch (err) {
        alert('❌ Erro de conexão com o servidor.');
      }
    });
  </script>
</body>
</html>
